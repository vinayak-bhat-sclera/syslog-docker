module(load="omhttp")  # For sending to your Spring Boot application
module(load="omfwd")   # For forwarding raw syslog messages to other servers

template(name="MyJSONTemplate" type="string" string="{\"message\":\"%msg%\",\"host\":\"%hostname%\",\"severity\":\"%syslogseverity-text%\"}")

# 1. Action to send logs to your Spring Boot application (HTTP POST)
# This uses the specific JSON template you defined.
action(
    type="omhttp"
    server="scleravdmsnetworkgateway"  # Hostname/IP of your Spring Boot server
    serverport="8888"       # Your Spring Boot server's port
    usehttps="off"
    restpath="syslogs"
    template="MyJSONTemplate"
    retry="on"
    batch="off"
)

# 2. Action to forward raw logs to a secondary server (configured via environment variables)
# This sends the original, raw syslog message.
# will only be active if FWD_SERVER_1_IP is set.
if $FWD_SERVER_1_IP != "" then { # Optional: Conditional forwarding
    action(
        type="omfwd"
        Target="`echo $FWD_SERVER_1_IP`"    # Reads value from FWD_SERVER_1_IP environment variable
        Port="`echo $FWD_SERVER_1_PORT`"  # Reads value from FWD_SERVER_1_PORT environment variable
        Protocol="udp"                    # Or "tcp"
    )
}

# 3.forward raw logs to a third server
# This action will only be active if FWD_SERVER_2_IP is set.
if $FWD_SERVER_2_IP != "" then { # Optional: Conditional forwarding
    action(
        type="omfwd"
        Target="`echo $FWD_SERVER_2_IP`"
        Port="`echo $FWD_SERVER_2_PORT`"
        Protocol="udp" # Or "udp"
    )
}