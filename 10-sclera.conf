# /etc/rsyslog.d/sclera.conf

# Load UDP sender module
module(load="omudp")

# Define JSON template
template(name="MyJSONTemplate" type="string" string="{\"message\":\"%msg%\",\"host\":\"%hostname%\",\"severity\":\"%syslogseverity-text%\"}")

# Send logs over UDP to local Spring Boot listener on port 8888
action(
    type="omudp"
    target="scleravdmsnetworkgateway"
    port="8888"
    template="MyJSONTemplate"
    protocol="udp"
)
